<!DOCTYPE html>
<html lang="{{ site.lang | default: 'zh-CN' }}">
  {% include head.html %}
  <body id="{{ page.body_id | default: page.layout }}">
    {% include header.html %}
    <main id="main" role="main">
      {{ content }}
    </main>
    {% include search.html %}
    {% include footer.html %}
    <button class="theme-toggle" type="button" id="J_theme_toggle" aria-label="切换深色模式" title="切换深色模式">
      <span class="theme-toggle-icon" aria-hidden="true"></span>
    </button>
    <script src="{{ '/assets/js/site.js' | relative_url }}"></script>
  </body>
</html>

<a href="{{ include.post.url | relative_url }}" rel="bookmark" title="{{ include.post.title | escape }}" class="header-href">
  <article class="hentry">
    <h2 class="entry-title">{{ include.post.title }}</h2>
    <div class="entry-content">
      <span>【{{ include.post.date | date: "%Y-%m-%d" }}】</span>{{ include.post.summary }}
    </div>
  </article>
</a>

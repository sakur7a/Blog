<a href="{{ include.post.url | relative_url }}" rel="bookmark" title="{{ include.post.title | escape }}" class="post-card">
  {% if include.post.cover %}
    <div
      class="post-card-cover"
      role="img"
      aria-label="{{ include.post.title | escape }} 封面"
      style="background-image: url('{{ include.post.cover | relative_url }}'); background-position: {{ include.post.cover_position | default: '50% 50%' }};"
    ></div>
  {% endif %}
  <article class="hentry">
    <h2 class="entry-title">{{ include.post.title }}</h2>
    <p class="entry-summary">
      <span>【{{ include.post.date | date: "%Y-%m-%d" }}】</span>{{ include.post.summary }}
    </p>
    {% if include.post.tags.size > 0 %}
    <p class="post-card-tags">
      {% for tag in include.post.tags %}
        <a href="{{ '/tags/' | relative_url }}#{{ tag }}" class="tag-chip tag-chip--sm">{{ tag }}</a>
      {% endfor %}
    </p>
    {% endif %}
  </article>
</a>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ page.summary | default: site.description | strip_html | strip_newlines | escape }}">
  <script>
    (function () {
      try {
        var theme = localStorage.getItem("sakura-theme");
        if (theme === "dark" || theme === "light") {
          document.documentElement.setAttribute("data-theme", theme);
        }
      } catch (error) {}
    })();
  </script>
  <link rel="stylesheet" href="{{ '/assets/css/jinkai.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  {% feed_meta %}
  {% seo title=false %}
</head>
